# Thin runner for the Taskfile. Every step below is a `task` command that
# works identically on a laptop; GitHub Actions only supplies the machine and
# a token to create the release. `task release` pushes the tag that triggers
# this. A shard is consumed as source by `shards`, so the release carries
# generated notes and no binaries.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install Task
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl --fail --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: task check-tag
      - run: task verify
      - run: task publish
        env:
          GH_TOKEN: ${{ github.token }}
