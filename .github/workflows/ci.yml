# Thin runner for the Taskfile. `task verify` is the whole check and runs
# identically on a laptop; GitHub Actions only supplies the machine. On main
# the API docs that `verify` generated are published to GitHub Pages.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install Task
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl --fail --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: task verify

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs/

  # Publishes docs/ from the verify job. Needs Pages enabled once in the
  # repository settings with "GitHub Actions" as the source.
  docs:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
